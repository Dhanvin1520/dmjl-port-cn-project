# dmjl_port - CN Phase 1 - Mac 1 private DNS (dnsmasq)
# Template: 10.7.7.61, 10.7.7.61 and 8.8.8.8 are filled in at setup.

# Don't read /etc/resolv.conf. Forward every non-project name upstream
# (college DNS first, Google as backup) so normal internet keeps working.
no-resolv
server=8.8.8.8
server=8.8.8.8

# Listen on the Wi-Fi interface and loopback, so OTHER Macs can query us
interface=en0
listen-address=127.0.0.1,10.7.7.61

# Private records: both names point to the nginx edge (Mac 2)
address=/app.dmjl.test/10.7.7.61
address=/api.dmjl.test/10.7.7.61

# TTL in seconds for our records
local-ttl=30

# Log every query
log-queries
log-facility=/tmp/dnsmasq.log
