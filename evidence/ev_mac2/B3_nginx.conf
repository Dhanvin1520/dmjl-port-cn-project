# dmjl_port - CN Phase 1 - Mac 2 edge (nginx)
# Template: /opt/homebrew, 10.7.3.17 and 10.3.2.17 are filled in at setup.
worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    keepalive_timeout 65;

    # Access log shows which backend served each request
    log_format lb '$remote_addr -> $upstream_addr "$request" $status';
    access_log /opt/homebrew/var/log/nginx/access.log lb;
    error_log  /opt/homebrew/var/log/nginx/error.log;

    # Load balancer pool - round robin by default
    upstream backend {
        server 10.7.3.17:3001 max_fails=1 fail_timeout=10s;  # Backend A
        server 10.3.2.17:3002 max_fails=1 fail_timeout=10s;  # Backend B
    }

    # Plain HTTP -> redirect to HTTPS
    server {
        listen 80;
        server_name app.dmjl.test api.dmjl.test;
        return 301 https://$host$request_uri;
    }

    # HTTPS edge - TLS terminates here
    server {
        listen 443 ssl;
        server_name app.dmjl.test api.dmjl.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/app.dmjl.test.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.dmjl.test-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
        }
    }
}
