# dmjl_port - CN Phase 1 - Mac 2 edge (nginx)
# Template: __BREW__, __MAC3_IP__ and __MAC4_IP__ are filled in at setup.
worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    keepalive_timeout 65;

    # Access log shows which backend served each request
    log_format lb '$remote_addr -> $upstream_addr "$request" $status';
    access_log __BREW__/var/log/nginx/access.log lb;
    error_log  __BREW__/var/log/nginx/error.log;

    # Load balancer pool - round robin by default
    upstream backend {
        server __MAC3_IP__:3001 max_fails=1 fail_timeout=10s;  # Backend A
        server __MAC4_IP__:3002 max_fails=1 fail_timeout=10s;  # Backend B
    }

    # Plain HTTP -> redirect to HTTPS
    server {
        listen 80;
        server_name app.dmjl.test api.dmjl.test;
        return 301 https://$host$request_uri;
    }

    # HTTPS edge - TLS terminates here
    server {
        listen 443 ssl;
        server_name app.dmjl.test api.dmjl.test;

        ssl_certificate     __BREW__/etc/nginx/certs/app.dmjl.test.pem;
        ssl_certificate_key __BREW__/etc/nginx/certs/app.dmjl.test-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
        }
    }
}
